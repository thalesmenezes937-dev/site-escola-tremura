<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administração — Calendário Escolar</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="admin-page">

        <div class="admin-card">

            <!-- LOGIN -->

            <div id="loginArea">

                <span class="subtitulo">
                    ÁREA RESTRITA
                </span>

                <h1>
                    Administração do Calendário
                </h1>

                <p>
                    Acesso exclusivo para administradores.
                </p>

                <form id="loginForm">

                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" placeholder="E-mail do administrador" required>

                    <label for="password">
                        Senha
                    </label>

                    <input type="password" id="password" placeholder="Senha" required>

                    <button type="submit">
                        Entrar
                    </button>

                    <p id="loginMessage"></p>

                </form>

            </div>


            <!-- PAINEL ADMINISTRATIVO -->

            <div id="adminArea" hidden>

                <div class="admin-header">

                    <div>

                        <span class="subtitulo">
                            PAINEL ADMINISTRATIVO
                        </span>

                        <h1>
                            Calendário Escolar
                        </h1>

                    </div>

                    <button id="logoutButton" type="button">
                        Sair
                    </button>

                </div>


                <!-- FORMULÁRIO DO EVENTO -->

                <form id="eventForm">

                    <label for="eventDate">
                        Data
                    </label>

                    <input type="date" id="eventDate" required>


                    <label for="eventTitle">
                        Evento
                    </label>

                    <input type="text" id="eventTitle" placeholder="Ex.: Prova Paulista" required>


                    <label for="eventDescription">
                        Descrição
                    </label>

                    <textarea id="eventDescription" placeholder="Descrição opcional"></textarea>


                    <div class="admin-actions">

                        <button type="submit">
                            Salvar evento
                        </button>

                        <button type="button" id="deleteButton">
                            Apagar evento
                        </button>

                    </div>

                </form>


                <!-- LISTA DE EVENTOS -->

                <div id="eventsList"></div>

            </div>

        </div>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="admin.js"></script>

</body>

</html>
